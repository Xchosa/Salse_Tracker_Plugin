name: Client Kanban CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: client-kanban-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-development/client-kanban

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugin-development/client-kanban/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run production build check
        run: pnpm build
