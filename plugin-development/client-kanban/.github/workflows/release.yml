name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tag and manifest versions match
        run: node -e "const manifest=require('./manifest.json'); const tag=process.env.GITHUB_REF_NAME; if(manifest.version!==tag) throw new Error('Tag '+tag+' does not match manifest '+manifest.version)"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and build
        run: pnpm test && pnpm build
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
